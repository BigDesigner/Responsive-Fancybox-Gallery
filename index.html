<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Responsive Fancybox Gallery</title>
	<link href="css/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0.36/dist/fancybox/fancybox.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="container mt-4">
        <div class="row gallery">
            <!-- Gallery Images with Captions -->
            <div class="col-md-3">
                <a href="images/img1.jpeg" data-fancybox="gallery" data-caption="Description for Image 1"><img src="images/img1.jpeg" alt="Image 1"></a>
            </div>
            <div class="col-md-3">
                <a href="images/img2.jpeg" data-fancybox="gallery" data-caption="Description for Image 2"><img src="images/img2.jpeg" alt="Image 2"></a>
            </div>
            <div class="col-md-3">
                <a href="images/img3.jpeg" data-fancybox="gallery" data-caption="Description for Image 3"><img src="images/img3.jpeg" alt="Image 3"></a>
            </div>
            <div class="col-md-3">
                <a href="images/img4.jpeg" data-fancybox="gallery" data-caption="Description for Image 4"><img src="images/img4.jpeg" alt="Image 4"></a>
            </div>
            <div class="col-md-3">
                <a href="images/img5.jpeg" data-fancybox="gallery" data-caption="Description for Image 5"><img src="images/img5.jpeg" alt="Image 5"></a>
            </div>
            <div class="col-md-3">
                <a href="images/img6.jpeg" data-fancybox="gallery" data-caption="Description for Image 6"><img src="images/img6.jpeg" alt="Image 6"></a>
            </div>
            <div class="col-md-3">
                <a href="images/img7.jpeg" data-fancybox="gallery" data-caption="Description for Image 7"><img src="images/img7.jpeg" alt="Image 7"></a>
            </div>
            <div class="col-md-3">
                <a href="images/img8.jpeg" data-fancybox="gallery" data-caption="Description for Image 8"><img src="images/img8.jpeg" alt="Image 8"></a>
            </div>
            <div class="col-md-3">
                <a href="images/img9.jpeg" data-fancybox="gallery" data-caption="Description for Image 9"><img src="images/img9.jpeg" alt="Image 9"></a>
            </div>
            <div class="col-md-3">
                <a href="images/img10.jpeg" data-fancybox="gallery" data-caption="Description for Image 10"><img src="images/img10.jpeg" alt="Image 10"></a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0.36/dist/fancybox/fancybox.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        Fancybox.bind("[data-fancybox]", {
            // Custom options can be added here
        });
    </script>
</body>
</html>
